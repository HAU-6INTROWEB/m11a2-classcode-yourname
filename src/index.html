<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curbside Thai - Split the receipt</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Split the receipt</h1>

    <div class="field">
      <label for="bill">Bill amount</label>
      <input type="number" id="bill" value="1000" min="0" step="0.01">
    </div>

    <div class="field">
      <label for="tipPct">Tip</label>
      <select id="tipPct">
        <option value="0">No tip</option>
        <option value="10">10%</option>
        <option value="15" selected>15%</option>
        <option value="20">20%</option>
      </select>
    </div>

    <div class="field">
      <label for="people">Diners</label>
      <input type="number" id="people" value="4" min="1">
    </div>

    <p id="warning" class="warning"></p>

    <table>
      <tr><th>Tip</th><td id="tipAmount">-</td></tr>
      <tr><th>Total due</th><td id="totalDue">-</td></tr>
      <tr><th>Each person pays</th><td id="perPerson">-</td></tr>
    </table>
  </main>
</body>
</html>
